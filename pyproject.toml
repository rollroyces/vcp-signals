[project]
name = "vcp-signals"
version = "0.2.0"
description = "VMAA Volatility Contraction Pattern (VCP) signal detection and validation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Royce"}]
dependencies = [
    "yfinance>=1.3.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pyarrow>=15.0",  # for S&P 500 constituents parquet cache
]

[project.optional-dependencies]
dev = [
    # Pin to versions verified by the local + CI matrix. Bump deliberately.
    "ruff==0.16.5",     # matches CI (Ubuntu 24.04, Python 3.10/3.11/3.12)
    "mypy==2.3.1",      # last 2.x with stable pandas-stubs handling
    "pytest>=8.0,<10",  # pytest 9 dropped some legacy plugins we don't use
    "pytest-cov>=5.0",
    "matplotlib>=3.8",  # for plotting forward-return distributions
]
backtest = [
    "matplotlib>=3.8",
    "xarray>=2024.1",  # for columnar / labelled backtest outputs (optional)
    "pyarrow>=15.0",   # already required, restated here for the extra group
]
parquet = [
    # Fast OHLCV backtests via parquet (replaces CSV reads when present).
    # Use this group when you have ~1M+ signal cohorts to backtest.
    "xarray>=2024.1",
    "pyarrow>=15.0",
    "dask>=2024.1",     # parallel parquet reads for very large backtests
]

[project.scripts]
vcp-scan = "vcp.run_scan:main"
vcp-cache = "vcp.cli_cache:main"
vcp-replay = "vcp.cli_replay:main"
vcp-calibrate = "vcp.cli_calibrate:main"
vcp-backtest = "vcp.backtest:_main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["vcp*"]
exclude = ["tests*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",  # line length — handled by formatter
    "B008",  # function-call-in-default-arg (we use this idiom intentionally in dataclasses)
    "RUF012",  # mutable class attributes — we use frozen=False in a controlled way
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]  # imports after path setup
"vcp/backtest.py" = ["PLR0913", "PLR2004"]  # backtest has many positional knobs; magic numbers ok in statistics

[tool.mypy]
python_version = "3.12"
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
explicit_package_bases = true
mypy_path = "."
# We don't enforce strict mode project-wide yet; detector has known Optional/Pandas
# type issues that would require a separate refactor. New code in backtest.py
# and tests should aim for --strict.
files = ["vcp"]

[[tool.mypy.overrides]]
module = ["yfinance", "pandas", "numpy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning:yfinance.*",
    "ignore::FutureWarning:pandas.*",
]
