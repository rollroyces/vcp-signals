name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Pinned in pyproject.toml. If you're seeing "resolution-too-deep"
          # errors here, the pyproject pins are likely ahead of what's in PyPI;
          # either sync the pins or comment this and use the version-range spec.
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check vcp tests
      - name: Type-check (mypy)
        run: mypy vcp
      - name: Run tests
        run: pytest --cov=vcp --cov-report=term-missing
